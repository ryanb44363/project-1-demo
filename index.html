<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parabola Plotter</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #controls {
      margin: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    canvas {
      border: 1px solid #ccc;
    }
    #demoLog {
      width: 800px;
      max-height: 150px;
      overflow-y: auto;
      background: #eef;
      padding: 8px;
      border: 1px solid #ccc;
      font-family: monospace;
      margin-bottom: 10px;
    }
    #customPlotForm {
      display: flex;
      gap: 6px;
      margin: 10px;
      align-items: center;
    }
    #customPlotForm input {
      width: 60px;
      padding: 4px;
    }
  </style>
</head>
<body>
  <h1>Parabola Plotter</h1>

  <div id="controls">
    <button id="parabolaModeBtn">Parabola Mode: OFF</button>
    <button id="trialPlotBtn">Trial &amp; Plot</button>
    <input type="number" id="numberInput" placeholder="Number" />
    <input type="number" id="involutionsInput" placeholder="Involutions" />
    <button id="calculateBtn">Calculate</button>
    <span id="status">Status: Disconnected</span>
  </div>

  <div id="demoLog"></div>

  <!-- Custom parabola plotting form -->
  <form id="customPlotForm">
    <label>a: <input type="number" step="any" id="aInput" value="1" /></label>
    <label>b: <input type="number" step="any" id="bInput" value="0" /></label>
    <label>c: <input type="number" step="any" id="cInput" value="0" /></label>
    <button type="button" id="plotCustomBtn">Plot Custom</button>
  </form>

  <canvas id="grid" width="800" height="800"></canvas>
  <script src="script.js"></script>
</body>
</html>
